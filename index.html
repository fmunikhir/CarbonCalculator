<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbon Footprint Calculator</title>

  <!-- Bootstrap 5 (mandatory) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body { font-family: Georgia, "Times New Roman", serif; background: #fff; }
    .page-title { font-weight: 700; }
    .heading-box { border: 2px solid #6f6fc8; display: inline-block; padding: 4px 24px; }

    /* Tab bar */
    .tab-bar { border: 2px solid #5bc0de; padding: 6px 12px; }
    .nav-tabs { border-bottom: 0; }
    .nav-tabs .nav-link { color: #4a4ab0; border: 0; }
    .nav-tabs .nav-link.active { color: #000; font-weight: 700; background: transparent; }
    .btn-green { background: #198754; color: #fff; border: 0; }
    .btn-green:hover { background: #146c43; color: #fff; }

    /* Card */
    .form-card { border: 2px solid #5bc0de; }
    .form-card .card-header { background: #198754; color: #fff; text-align: center; }
    .form-card .card-footer { text-align: center; border: 2px solid #f08a6c; }

    /* Calculate hyperlink styled as blue button */
    .calc-link {
      display: inline-block; background: #0d6efd; color: #fff;
      padding: 8px 24px; border-radius: 6px; text-decoration: none;
    }
    .calc-link:hover { background: #0a58ca; color: #fff; }
  </style>
</head>

<body>
<div class="container-fluid p-3">

  <!-- 1. Main heading (h1) -->
  <div class="row">
    <div class="col-12 text-center my-3">
      <h1 class="page-title heading-box">Carbon Footprint Calculator</h1>
    </div>
  </div>

  <!-- 2. Subheading (h2) -->
  <div class="row">
    <div class="col-12 text-center">
      <h2>Climate change is real!!</h2>
    </div>
  </div>

  <!-- 3 & 4. Intro paragraph + image -->
  <div class="row align-items-center my-3">
    <div class="col-md-8">
      <!-- REPLACE this text with the intro text from your reference screenshot -->
      <p>
       
      </p>
    </div>
    <div class="col-md-4 text-center">
      <!-- REPLACE src with your own image file, e.g. images/footprint.jpg -->
      <img class="img-fluid" alt="Carbon footprint illustration" style="max-height:200px"
           src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='200'><rect width='300' height='200' fill='%23d1e7dd'/><circle cx='150' cy='90' r='55' fill='%23198754'/><text x='150' y='98' font-size='22' fill='white' text-anchor='middle'>CO2</text><text x='150' y='180' font-size='16' fill='%23146c43' text-anchor='middle'>Reduce your footprint</text></svg>">
    </div>
  </div>

  <!-- 5 & 6. h4 + supporting paragraph -->
  <div class="row">
    <div class="col-12 text-center">
      <!-- REPLACE with the exact heading from the reference screenshot -->
      <h4>Assess your carbon footprint today</h4>
      <!-- REPLACE with the exact awareness message from the screenshot -->
      <p>Replace this with the environmental awareness message shown in the reference screenshot.</p>
    </div>
  </div>

  <!-- 7. Calculate button (styled hyperlink) -->
  <div class="row mb-4">
    <div class="col-12 text-center">
      <a href="#" class="calc-link">Calculate</a>
    </div>
  </div>

  <!-- Tab bar -->
  <div class="row">
    <div class="col-12">
      <div class="tab-bar d-flex align-items-center justify-content-between">
        <ul class="nav nav-tabs" id="calcTabs" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#general" type="button">General</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#home" type="button">Home</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#travel" type="button">Travel</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#food" type="button">Food</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#electronic" type="button">Electronic usage</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#shopping" type="button">Shopping</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#result" type="button">Result</button></li>
        </ul>
        <button class="btn btn-green">Home</button>
      </div>
    </div>
  </div>

  <!-- Card -->
  <div class="row justify-content-center mt-3">
    <div class="col-lg-6 col-md-8">
      <div class="card form-card">
        <div class="card-header fs-5">Fill the form below</div>

        <div class="card-body">
          <div class="tab-content">

            <!-- General form (visible first) -->
            <div class="tab-pane fade show active" id="general">
              <div class="row mb-3">
                <label class="col-4 col-form-label">Name</label>
                <div class="col-8"><input type="text" class="form-control"></div>
              </div>
              <div class="row mb-3">
                <label class="col-4 col-form-label">Age</label>
                <div class="col-8"><input type="number" class="form-control"></div>
              </div>
              <div class="row mb-3">
                <label class="col-4 col-form-label">Country</label>
                <div class="col-8">
                  <select class="form-select">
                    <option selected>Saudi Arabia</option>
                    <option>United Arab Emirates</option>
                    <option>Egypt</option>
                    <option>United Kingdom</option>
                    <option>United States</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Other (hidden) forms -->
            <div class="tab-pane fade" id="home">
              <div class="row mb-3"><label class="col-6 col-form-label">Electricity use (kWh/month)</label><div class="col-6"><input type="number" class="form-control"></div></div>
            </div>
            <div class="tab-pane fade" id="travel">
              <div class="row mb-3"><label class="col-6 col-form-label">Distance driven (km/week)</label><div class="col-6"><input type="number" class="form-control"></div></div>
            </div>
            <div class="tab-pane fade" id="food">
              <div class="row mb-3"><label class="col-6 col-form-label">Meat meals per week</label><div class="col-6"><input type="number" class="form-control"></div></div>
            </div>
            <div class="tab-pane fade" id="electronic">
              <div class="row mb-3"><label class="col-6 col-form-label">Screen hours per day</label><div class="col-6"><input type="number" class="form-control"></div></div>
            </div>
            <div class="tab-pane fade" id="shopping">
              <div class="row mb-3"><label class="col-6 col-form-label">New items bought per month</label><div class="col-6"><input type="number" class="form-control"></div></div>
            </div>
            <div class="tab-pane fade" id="result">
              <p class="text-center mb-0">Your result will appear here.</p>
            </div>

          </div>
        </div>

        <div class="card-footer">
          <button class="btn btn-green me-2" id="prevBtn" type="button">Prev</button>
          <button class="btn btn-green" id="nextBtn" type="button">Next</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Prev / Next move between the tabs
  const tabs = Array.from(document.querySelectorAll('#calcTabs .nav-link'));
  function currentIndex() { return tabs.findIndex(t => t.classList.contains('active')); }
  document.getElementById('nextBtn').addEventListener('click', () => {
    const i = currentIndex(); if (i < tabs.length - 1) new bootstrap.Tab(tabs[i + 1]).show();
  });
  document.getElementById('prevBtn').addEventListener('click', () => {
    const i = currentIndex(); if (i > 0) new bootstrap.Tab(tabs[i - 1]).show();
  });
</script>
</body>
</html>
